services:
  - type: web
    name: expenso-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:9000,http://localhost:5173
      # Optional: set this instead of CORS_ORIGINS if you want to allow all Vercel preview/prod subdomains.
      # Example: ^https://.*\\.vercel\\.app$
      - key: CORS_ORIGIN_REGEX
        sync: false
